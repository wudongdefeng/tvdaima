name: init

on:
  workflow_dispatch:
  #push:
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: init
      run: |                
        curl -o tvlog.zip https://github.com/vircloud/TVLogo/archive/refs/tags/v20240206.zip
        sudo apt install unzip
        cp -ur ./v20240206/TVLogo-20240206/*.png ./tvlogo-2024/
        rm -rm *v20240206*
    - name: Git init
      run: |
        git config --global user.name "Actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "init" -a || echo "Nothing to update"
        git push
