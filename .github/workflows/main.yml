name: init

on:
  workflow_dispatch:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download and Extract
      run: |
        rm -rf tvlogo-2024/*

    - name: Commit
      run: |
        git config --global user.name "Actions"
        git config --global user.email "actions@github.com"

        git add .

        git commit -m "init" || echo "Nothing to update"

        git push
